; Guition ESP32-4848S040C_I_Y_1
; ESP32-S3, 16 MB QIO flash, 8 MB OPI PSRAM, CH340 USB-UART (not USB-CDC).
; Display stack is Arduino_GFX device ESP32_4848S040_86BOX_GUITION.

[env:esp32-4848s040c]
platform = espressif32@6.9.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304

build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#v1.6.0
    lvgl/lvgl@8.4.0
    https://github.com/TAMCTec/gt911-arduino.git#v1.0.2
    bblanchon/ArduinoJson@6.21.5

monitor_filters = esp32_exception_decoder
